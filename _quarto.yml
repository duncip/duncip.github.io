project:
  type: website

website:
  description: "A blog built with Quarto"
  site-url: https://duncip.github.io # you must change this appropriately for RSS feeds to work properly
  title: "Duncan's Blog"
  navbar:
    left:
      - href: index.qmd
        text: Blog
      - about.qmd
format:
  html:
    theme:
      - flatly
    css: styles.css
    code-fold: true      # code is collapsible, but still on the page
    code-tools: true     # "view source" and copy buttons
    toc: true

execute:
  freeze: auto



